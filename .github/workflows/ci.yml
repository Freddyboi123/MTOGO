name: CI

on:
  pull_request:
    branches: [review, main]
  push:
    branches: [review, main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - run: mvn -B verify
