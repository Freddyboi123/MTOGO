name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build and test

        working-directory: Backend
        run: mvn -B package        

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mtogo-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mtogo-backend:${{ github.sha }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          build-args: VITE_API_URL=https://mtogo.api.roneu.dk
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mtogo-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mtogo-frontend:${{ github.sha }}