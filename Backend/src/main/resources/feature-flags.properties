# Feature flags shared by the whole team (true/false).
# A flag that is missing counts as false.
# An environment variable with the same name overrides the value here,
# e.g. set FEATURE_RESTAURANT_OVERVIEW=false on the server to switch a feature off without a deploy.

# Epic 1, US-01 and US-02: restaurant overview and restaurant menu
FEATURE_RESTAURANT_OVERVIEW=true

# Epic 4, US-09 to US-11: delivery agents see, take and update deliveries
FEATURE_DELIVERY_OVERVIEW=false

# Epic 3, US-05 to US-08: basket, placing an order and order history
FEATURE_ORDERING=true

# Epic 5, US-12 to US-14: bonuses for delivery agents
FEATURE_DELIVERY_BONUS=false

# US-18 and US-21: the restaurant updates the order status and the customer follows it
FEATURE_ORDER_STATUS=false

# US-19: the customer rates the order after delivery
FEATURE_RATINGS=false

# US-20: management dashboard
FEATURE_MANAGEMENT_DASHBOARD=false

# US-22: language choice
FEATURE_LANGUAGE_CHOICE=false
